# Posts the PR Tests results as a sticky comment.
#
# SECURITY: this workflow holds a writable token, so it must never execute code
# from the pull request. It runs on workflow_run, which always uses the workflow
# definition from the default branch.
#
#   * The checkout below has NO `ref:` on purpose. In a workflow_run event
#     GITHUB_SHA is the default-branch head, so this fetches trusted code.
#     Adding `ref:` to check out the PR would recreate the pwn-request hole.
#   * The downloaded artifact is data only. It is never executed, and
#     render-comment.mjs size-caps, parses and shape-checks it before use.

name: PR Test Comment

on:
  workflow_run:
    workflows: ["PR Tests"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

# Serialized: two rapid pushes would otherwise let both runs find no existing
# comment and each create one, duplicating the sticky comment permanently.
concurrency:
  group: pr-test-comment
  cancel-in-progress: false

jobs:
  comment:
    name: Post results
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref:` — see the security note above.
      - name: Checkout trusted tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download results artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-test-results
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for screenshots
        id: screenshots
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cypress-screenshots
          path: screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render comment
        id: render
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HAS_SCREENSHOTS: ${{ steps.screenshots.outcome == 'success' }}
        run: node scripts/ci/render-comment.mjs artifact comment.md

      - name: Verify and post
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.render.outputs.pr_number }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- virtual-select-pr-tests -->';
            const run = context.payload.workflow_run;

            // The PR number comes from the artifact because workflow_run.pull_requests
            // is empty for fork PRs. It is attacker-controlled, hence the check below.
            let prNumber = Number(process.env.PR_NUMBER || 0);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              prNumber = run.pull_requests?.[0]?.number ?? 0;
            }
            if (!prNumber) {
              core.info('No PR number available; nothing to comment on.');
              return;
            }

            // Anti-spoofing: only comment on a PR whose head is the commit we tested.
            // This also drops stale runs after a newer push, which is desirable.
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            if (pr.head.sha !== run.head_sha) {
              core.warning(`Refusing to comment: PR #${prNumber} head ${pr.head.sha} != tested ${run.head_sha}`);
              return;
            }

            const body = fs.existsSync('comment.md')
              ? fs.readFileSync('comment.md', 'utf8')
              : `${marker}\n### PR Test Results — ⚠️ no results\n\nThe run finished without producing a usable results artifact. [View run](${run.html_url})`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body });
              core.info(`Created comment on PR #${prNumber}`);
            }
