# Runs the full test suite on every pull request.
#
# SECURITY: this workflow executes code authored by the pull request. It must
# never hold write permissions or reference secrets. Results are handed to
# pr-test-comment.yml as data, and that workflow does the posting.
#
# IMPORTANT — what these checks are and are not:
# On a pull_request event GitHub runs the workflow definition from the PR's
# merge commit, so a pull request can edit THIS FILE. A malicious fork PR can
# therefore replace these jobs with no-ops and make every check green, and can
# equally forge the contents of the results comment. Neither the job checks nor
# the comment is a trust anchor against a hostile contributor.
#
# The controls that actually work for that threat are:
#   1. Settings > Actions > "Require approval for all external contributors",
#      so no fork workflow runs until a maintainer approves it.
#   2. CODEOWNERS on .github/** and scripts/ci/**, so changes to CI itself
#      require review.
# Required status checks are still worth enabling: they catch honest mistakes,
# which is the overwhelmingly common case. Use "Report" — it aggregates every
# other check (see the gate step at the end of that job).

name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Each check uses `if: always()` so one failure does not hide the others.
      # run-step.mjs still propagates the exit code, so the job fails correctly.
      - name: Typecheck
        if: always()
        run: node scripts/ci/run-step.mjs Typecheck npm run typecheck

      - name: ESLint
        if: always()
        run: node scripts/ci/run-step.mjs ESLint npm run lint:js

      - name: Stylelint
        if: always()
        run: node scripts/ci/run-step.mjs Stylelint npm run lint:css

      - name: CI script tests
        if: always()
        run: node scripts/ci/run-step.mjs "CI Scripts" npm run test:scripts

      - name: Upload result fragments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fragments-static
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The build copies dist/ into docs/assets/, which is what Cypress serves.
      # Without this the specs would run against the stale committed bundles.
      - name: Build
        run: node scripts/ci/run-step.mjs Build npm run build

      # Deliberately not `if: always()` — if the build failed there is nothing
      # meaningful to test, and the missing fragment renders as "E2E skipped".
      - name: E2E
        run: node scripts/ci/run-e2e.mjs

      - name: Upload result fragments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fragments-e2e
          path: ci-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [static, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Jobs run on separate runners, so fragments arrive as artifacts.
      - name: Download result fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fragments-*
          merge-multiple: true
          path: ci-results

      - name: Merge results
        run: node scripts/ci/merge-results.mjs ci-results report/results.json

      # Values reach the script through env, never interpolated into the script body.
      - name: Write PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("report/pr.json", JSON.stringify({
              number: Number(process.env.PR_NUMBER),
              headSha: process.env.PR_HEAD_SHA,
            }));
          '

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-test-results
          path: report/
          retention-days: 3

      # Ordering is load-bearing: this MUST come after the upload. Failing any
      # earlier would abort the job before the artifact exists, leaving the
      # comment workflow with nothing and producing no PR comment at all.
      #
      # Without this step the report job can never fail on content — it would
      # stay green even when the build and e2e failed, and branch protection
      # pointed at "Report" would give no protection whatsoever.
      - name: Fail if any check failed
        env:
          RESULTS_FILE: report/results.json
        run: |
          node -e '
            const fs = require("node:fs");
            const results = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, "utf8"));
            const failed = results.checks.filter((check) => check.outcome !== "passed");
            if (results.conclusion !== "passed") {
              console.error(`Conclusion: ${results.conclusion}`);
              for (const check of failed) console.error(`  ${check.label}: ${check.outcome}`);
              process.exit(1);
            }
            console.log("All checks passed.");
          '
